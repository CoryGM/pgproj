name: Release

# Builds, packages, verifies, and publishes pgproj (G-81). See DEVELOPING.md, "Releasing".
#   git tag v0.1.0 && git push origin v0.1.0    ->  builds everything and creates the GitHub Release.
#   Run manually (workflow_dispatch)             ->  builds and verifies everything and keeps the files as workflow artifacts,
#                                                    without creating a release (a dry run).
# The version is the tag without its v (MinVer). Linux is built first, then Windows, then macOS; the release waits for all three.
# The engine's NuGet package, PgProj.Engine (G-319), is packed with the same version, verified on Linux, Windows, and macOS by a program that
# uses it (packaging/nuget/verify-package.sh), attached to the release, and pushed to nuget.org last, with Trusted Publishing: nuget.org trusts
# this workflow file of this repository (a policy on the CoryGM account), so no API key is stored here. The push runs only when the repository
# variable NUGET_PUBLISH is "true" (Settings > Secrets and variables > Actions > Variables), set once the policy exists; without it a tag makes
# the GitHub Release and skips nuget.org. The CLI as a .NET tool, the package pgproj (G-323; dotnet tool install -g pgproj), is packed, verified
# (packaging/nuget/verify-tool.sh: installed with dotnet tool install and smoke-tested), attached, and pushed beside it, the same way.
#
# The Linux packages are signed (G-331): the .rpm files, the release's SHA256SUMS.txt (SHA256SUMS.txt.asc), and the signed apt and dnf
# repositories that a tag publishes to GitHub Pages (https://corygm.github.io/pgproj, packaging/linux/build-repository.sh). Without the key a
# throwaway one is used to test every signing step, and nothing signed with it is released or published.
#
# The Windows files (pgproj.exe, PgProj.*.dll, the .msi) are signed with Azure Artifact Signing (G-333): the windows job runs in the environment
# "release" (which allows tags v* and the branch main), and signtool with Microsoft's plugin logs in to Azure with GitHub's OIDC token, through a
# federated credential that trusts that environment (packaging/windows/build-packages.ps1). No certificate or key is stored here.
#
# Optional secrets (Settings > Secrets and variables > Actions):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID
#                                  secrets of the environment "release": the app registration allowed to sign with the certificate profile
#   LINUX_SIGNING_KEY              the Linux signing key, an armored OpenPGP secret key (DEVELOPING.md, "Releasing", Signing)
#   LINUX_SIGNING_PASSPHRASE       its passphrase
# Without them the Windows files are built unsigned, and the Linux .rpm files and checksums are unsigned and no repository is published. macOS
# files are never signed by an Apple Developer ID or notarized.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        run: |
          version="$(dotnet msbuild src/PgProj.Cli/PgProj.Cli.csproj -restore -t:MinVer -getProperty:MinVerVersion -nologo)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version: $version"

      - name: A release must be built from a tag
        if: github.ref_type == 'tag'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if [[ "${{ steps.version.outputs.version }}" != "$expected" ]]; then
            echo "The tag $GITHUB_REF_NAME builds version ${{ steps.version.outputs.version }}, not $expected." >&2
            exit 1
          fi

  linux:
    name: Linux (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: docker/setup-qemu-action@v4 # to run the arm64 packages
        with:
          platforms: arm64

      - name: Build the archive, .deb, and .rpm
        run: packaging/linux/build-packages.sh "${{ matrix.rid }}" "${{ needs.version.outputs.version }}" dist

      - name: Install each package in a clean container and run it
        run: packaging/linux/verify-packages.sh dist "${{ needs.version.outputs.version }}" "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  linux-signing:
    name: Linux signing and repositories
    needs: [version, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4 # to install the arm64 packages
        with:
          platforms: arm64

      - uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: dist/linux-x64

      - uses: actions/download-artifact@v8
        with:
          name: linux-arm64
          path: dist/linux-arm64

      - name: The signing key (the release key, or a throwaway one without the secrets)
        id: key
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: |
          output="$(packaging/linux/signing-key.sh "$RUNNER_TEMP/signing")"
          kind="$(sed -n 1p <<<"$output")"
          fingerprint="$(sed -n 2p <<<"$output")"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Signing with the $kind key $fingerprint"
          # The release key must be the one the repository publishes, so a user can check it against the file in the repository.
          if [[ "$kind" == release ]]; then
            published="$(gpg --batch --with-colons --show-keys packaging/linux/pgproj-signing-key.asc | awk -F: '/^fpr/ { print $10; exit }')"
            [[ "$published" == "$fingerprint" ]] || { echo "LINUX_SIGNING_KEY ($fingerprint) is not packaging/linux/pgproj-signing-key.asc ($published)" >&2; exit 1; }
          fi

      - name: Sign the .rpm packages
        run: |
          packaging/linux/sign-rpms.sh dist/linux-x64 "$RUNNER_TEMP/signing"
          packaging/linux/sign-rpms.sh dist/linux-arm64 "$RUNNER_TEMP/signing"

      - name: Build the repositories from this version, and install from them in clean containers
        run: |
          channel=stable
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then channel=testing; fi
          mkdir -p packages/this packages/none
          cp dist/linux-*/*.deb dist/linux-*/*.rpm packages/this/
          if [[ "$channel" == stable ]]; then
            packaging/linux/build-repository.sh site "$RUNNER_TEMP/signing" packages/this packages/this
          else
            packaging/linux/build-repository.sh site "$RUNNER_TEMP/signing" packages/none packages/this
          fi
          packaging/linux/verify-repository.sh site "$channel" "${{ needs.version.outputs.version }}" linux-x64
          packaging/linux/verify-repository.sh site "$channel" "${{ needs.version.outputs.version }}" linux-arm64

      # With the release key the signed .rpm files replace the unsigned ones, so the GitHub Release has them; a throwaway signature is not kept.
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.kind == 'release'
        with:
          name: linux-x64
          path: dist/linux-x64/*
          overwrite: true
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.kind == 'release'
        with:
          name: linux-arm64
          path: dist/linux-arm64/*
          overwrite: true
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.rid }})
    needs: [version, linux]
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release # its secrets, and the federated credential trusts it
    permissions:
      contents: read
      id-token: write # Artifact Signing: GitHub's OIDC token is exchanged for an Azure token
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARTIFACT_SIGNING_ENDPOINT: https://eus.codesigning.azure.net # the account's region, East US
      ARTIFACT_SIGNING_ACCOUNT: pgprojsigning
      ARTIFACT_SIGNING_PROFILE: pgprojrelease
      ARTIFACT_SIGNING_CLIENT: 1.0.146 # Microsoft.ArtifactSigning.Client, the signtool plugin
      ARTIFACT_SIGNING_CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Prepare Artifact Signing
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $package = Join-Path $dir 'client.zip' # a .nupkg is a zip, and Expand-Archive takes only the .zip extension
          $id = 'microsoft.artifactsigning.client'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/$env:ARTIFACT_SIGNING_CLIENT/$id.$env:ARTIFACT_SIGNING_CLIENT.nupkg" -OutFile $package
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash
          if ($hash -ne $env:ARTIFACT_SIGNING_CLIENT_SHA256) { throw "Microsoft.ArtifactSigning.Client $env:ARTIFACT_SIGNING_CLIENT has SHA256 $hash" }
          Expand-Archive $package (Join-Path $dir 'client')
          # Only the workload identity (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_FEDERATED_TOKEN_FILE) is tried.
          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_PROFILE
            CorrelationId = "$env:GITHUB_REPOSITORY run $env:GITHUB_RUN_ID ${{ matrix.rid }}"
            ExcludeCredentials = @('ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzureCliCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata
          "ARTIFACT_SIGNING_DLIB=$(Join-Path $dir 'client\bin\x64\Azure.CodeSigning.Dlib.dll')" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV
          "AZURE_FEDERATED_TOKEN_FILE=$(Join-Path $dir 'github-oidc-token')" >> $env:GITHUB_ENV

      - name: Build the zip and the installer
        shell: pwsh
        run: packaging/windows/build-packages.ps1 -Rid "${{ matrix.rid }}" -Version "${{ needs.version.outputs.version }}" -Output dist

      - name: Run the published application
        if: matrix.rid == 'win-x64' # an arm64 build cannot run on this x64 runner
        shell: bash
        run: packaging/smoke-test.sh "dist/pgproj-${{ needs.version.outputs.version }}-${{ matrix.rid }}/pgproj.exe" "${{ needs.version.outputs.version }}"

      - name: Install the MSI, run it from the PATH, and uninstall it
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist/pgproj-${{ needs.version.outputs.version }}-${{ matrix.rid }}.msi").Path
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -NoNewWindow
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          pgproj --version
          if ($LASTEXITCODE -ne 0) { Get-Content install.log -Tail 50; throw 'pgproj did not run after the MSI install' }
          Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -NoNewWindow
          if (Test-Path "$env:ProgramFiles\pgproj") { throw 'the uninstall left the install folder behind' }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS (osx-arm64)
    needs: [version, windows]
    runs-on: macos-14 # Apple silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the archive
        run: packaging/publish-unix.sh osx-arm64 "${{ needs.version.outputs.version }}" dist

      - name: Run the published application
        run: packaging/smoke-test.sh "dist/pgproj-${{ needs.version.outputs.version }}-osx-arm64/pgproj" "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: osx-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  nuget:
    name: NuGet packages (pack)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack PgProj.Engine
        run: |
          dotnet pack src/PgProj.Engine/PgProj.Engine.csproj -c Release -o nupkg
          test -f "nupkg/PgProj.Engine.${{ needs.version.outputs.version }}.nupkg"
          test -f "nupkg/PgProj.Engine.${{ needs.version.outputs.version }}.snupkg"

      - name: Pack the .NET tool pgproj
        run: |
          dotnet pack src/PgProj.Cli/PgProj.Cli.csproj -c Release -o nupkg
          test -f "nupkg/pgproj.${{ needs.version.outputs.version }}.nupkg"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: nupkg/*
          if-no-files-found: error

  nuget-verify:
    name: NuGet packages (${{ matrix.os }})
    needs: [version, nuget]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14] # linux-x64, win-x64, osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: nupkg

      - name: Build, publish, and run a program that uses the package
        shell: bash
        run: packaging/nuget/verify-package.sh nupkg "${{ needs.version.outputs.version }}"

      - name: Install and run the .NET tool
        shell: bash
        run: packaging/nuget/verify-tool.sh nupkg "${{ needs.version.outputs.version }}"

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, linux, linux-signing, windows, macos, nuget-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    env:
      HAS_LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Software bill of materials
        run: |
          dotnet tool install --global CycloneDX
          dotnet restore src/PgProj.Cli/PgProj.Cli.csproj
          dotnet-CycloneDX src/PgProj.Cli/PgProj.Cli.csproj --output dist --filename "pgproj-${{ needs.version.outputs.version }}.sbom.cdx.json" --output-format Json

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the checksums, and attach the public key
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: |
          packaging/linux/signing-key.sh "$RUNNER_TEMP/signing"
          packaging/linux/sign-file.sh dist/SHA256SUMS.txt "$RUNNER_TEMP/signing"
          cp packaging/linux/pgproj-signing-key.asc dist/pgproj-signing-key.asc

      - name: Attest build provenance # not available to a private repository on this plan
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.version.outputs.version }}"
          packaging/release-notes.sh "$version" > notes.md
          flags=()
          if [[ -s notes.md ]]; then flags+=(--notes-file notes.md); else flags+=(--generate-notes); fi
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "pgproj $version" "${flags[@]}"

  nuget-publish:
    name: Publish to nuget.org
    if: github.ref_type == 'tag' && vars.NUGET_PUBLISH == 'true'
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing: GitHub's OIDC token is exchanged for a one-hour nuget.org key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: nupkg

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: CoryGM # the nuget.org profile that owns the package and the Trusted Publishing policy

      - name: Push PgProj.Engine and its symbols
        run: dotnet nuget push "nupkg/PgProj.Engine.${{ needs.version.outputs.version }}.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push the .NET tool pgproj
        run: dotnet nuget push "nupkg/pgproj.${{ needs.version.outputs.version }}.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  repository:
    name: Publish the apt and dnf repositories
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      HAS_LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY != '' }}
    steps:
      - name: Without the signing key nothing is published
        if: env.HAS_LINUX_SIGNING_KEY != 'true'
        run: echo "::notice::LINUX_SIGNING_KEY is not set, so the apt and dnf repositories were not published."

      - uses: actions/checkout@v7
        if: env.HAS_LINUX_SIGNING_KEY == 'true'

      - name: Build the repositories from the releases
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
        run: |
          packaging/linux/signing-key.sh "$RUNNER_TEMP/signing"
          packaging/linux/collect-releases.sh packages/stable packages/testing
          packaging/linux/build-repository.sh site "$RUNNER_TEMP/signing" packages/stable packages/testing
          channel=stable
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then channel=testing; fi
          packaging/linux/verify-repository.sh site "$channel" "${{ needs.version.outputs.version }}" linux-x64

      - uses: actions/upload-pages-artifact@v3
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        uses: actions/deploy-pages@v4
