name: CLA

# Requires every pull request author to sign CLA.md (G-144). The bot comments on a pull request from an author who has not signed;
# the author replies with the sentence below and the check turns green. Signatures are kept in signatures/v1/cla.json on the
# cla-signatures branch, which must exist before the first run:
#   git push origin "$(git rev-parse main)":refs/heads/cla-signatures
# This workflow runs with the base repository's permissions and does not check out the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CoryGM/pgproj/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: CoryGM,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before we can accept it, please sign the pgproj Contributor License Agreement (CLA.md).
            To sign, reply to this comment with the sentence below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
