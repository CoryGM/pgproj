name: Bug report
description: pgproj did something wrong, missed something, or would not install or run.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying pgproj. Please check [Troubleshooting](https://github.com/CoryGM/pgproj/blob/main/docs/troubleshooting.md) first: it explains
        the common messages.

        **Leave out passwords and private data.** pgproj masks passwords in what it prints, but check anything you paste: connection strings, SQL, and
        output. A small made-up schema that shows the problem is the most useful thing you can attach.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
      placeholder: |
        After `pgproj publish --execute`, `pgproj diff` still reports the view app.orders_v as changed.
        I expected no differences.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The whole command line, with the password replaced by `*****`.
      render: shell
      placeholder: pgproj diff --project pgproj.json --target-connection "Host=localhost;Database=shop;Username=postgres;Password=*****"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What pgproj printed
      description: Its output (with `--verbose` if you can), or the part that matters.
      render: text

  - type: textarea
    id: sql
    attributes:
      label: SQL that shows it
      description: The smallest SQL (project files, or what is in the database) that makes it happen, if you have it.
      render: sql

  - type: textarea
    id: about
    attributes:
      label: What pgproj about prints
      description: |
        Run `pgproj about` in the folder you ran the command in, with the same `--project` and connection options, and paste what it prints. It shows
        the version, how pgproj was installed, the operating system, the project it found, and each database's PostgreSQL version. It never prints a
        password; remove host names and paths if they are private. If pgproj will not install or start, give the operating system and how you
        tried to install it instead.
      render: text
      placeholder: |
        pgproj <version>+<commit>
          Installed as: a .NET tool
          Operating system: Ubuntu 24.04.1 LTS (X64)
          ...
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have left out passwords, connection details I do not want public, and private data.
          required: true
