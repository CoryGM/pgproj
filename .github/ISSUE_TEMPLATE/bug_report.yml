name: Bug report
description: pgproj did something wrong, missed something, or would not install or run.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying pgproj. Please check [Troubleshooting](https://github.com/CoryGM/pgproj/blob/main/docs/troubleshooting.md) first: it explains
        the common messages.

        **Leave out passwords and private data.** pgproj masks passwords in what it prints, but check anything you paste: connection strings, SQL, and
        output. A small made-up schema that shows the problem is the most useful thing you can attach.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
      placeholder: |
        After `pgproj publish --execute`, `pgproj diff` still reports the view app.orders_v as changed.
        I expected no differences.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The whole command line, with the password replaced by `*****`.
      render: shell
      placeholder: pgproj diff --project pgproj.json --target-connection "Host=localhost;Database=shop;Username=postgres;Password=*****"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What pgproj printed
      description: Its output (with `--verbose` if you can), or the part that matters.
      render: text

  - type: textarea
    id: sql
    attributes:
      label: SQL that shows it
      description: The smallest SQL (project files, or what is in the database) that makes it happen, if you have it.
      render: sql

  - type: input
    id: version
    attributes:
      label: pgproj version
      description: What `pgproj --version` prints.
      placeholder: 0.1.0+bcc8f6a...
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - .NET tool (dotnet tool install)
        - apt repository (Debian, Ubuntu)
        - dnf repository (Fedora, RHEL)
        - .deb or .rpm file
        - Windows installer (.msi)
        - Archive (.zip or .tar.gz)
        - Built from source
        - The PgProj.Engine NuGet package (library)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 x64, Ubuntu 24.04 arm64, macOS 15 (Apple silicon), ...
    validations:
      required: true

  - type: dropdown
    id: postgres
    attributes:
      label: PostgreSQL server version
      description: The server pgproj connected to, if it connected to one.
      options:
        - "18"
        - "17"
        - "16"
        - "15"
        - "14"
        - Another version
        - No server involved
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have left out passwords, connection details I do not want public, and private data.
          required: true
